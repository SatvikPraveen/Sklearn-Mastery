site_name: sklearn-mastery
site_description: A research-grade toolkit for reproducible machine-learning experiments with scikit-learn
site_author: Satvik Praveen
site_url: https://satvikpraveen.github.io/Sklearn-Mastery/

repo_name: SatvikPraveen/Sklearn-Mastery
repo_url: https://github.com/SatvikPraveen/Sklearn-Mastery
edit_uri: edit/main/docs/

copyright: MIT License &copy; Satvik Praveen

# Build hooks live under docs/ but are not pages.
exclude_docs: |
  hooks/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

# Narrow logging filter for one known library-docstring warning; see the module docstring.
hooks:
  - docs/hooks/known_docstring_warnings.py

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
              # Library docstrings occasionally join parameter names ("n_train, n_test:"),
              # which griffe cannot parse; those are tracked as library issues, not docs issues.
              warnings: false
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: false
            separate_signature: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]
            show_if_no_docstring: false
            inherited_members: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SatvikPraveen/Sklearn-Mastery

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide:
      - Research workflow:
          - Benchmarking: research/benchmarking.md
          - Statistical comparison: research/statistical_comparison.md
          - Calibration and bias-variance: research/calibration_bias_variance.md
      - Library:
          - Data: guide/data.md
          - Models: guide/models.md
          - Ensembles: guide/ensembles.md
          - Pipelines: guide/pipelines.md
          - Evaluation: guide/evaluation.md
          - Command-line interface: guide/cli.md
      - From scratch: from_scratch.md
  - API reference:
      - research: api/research.md
      - data: api/data.md
      - models.supervised: api/models_supervised.md
      - models.unsupervised: api/models_unsupervised.md
      - models.ensemble: api/models_ensemble.md
      - pipelines: api/pipelines.md
      - evaluation: api/evaluation.md
      - from_scratch: api/from_scratch.md
      - config: api/config.md
  - Development:
      - Contributing: development/contributing.md
      - Changelog: development/changelog.md
      - Citing: development/citing.md
